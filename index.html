
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MichaelDryden.co.uk</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            background: #080808;
            overflow-x: hidden;
        }

        /* Blurred atmospheric background */
        .background {
            position: fixed;
            inset: -100px;
            z-index: -2;
            overflow: hidden;
            background:
                radial-gradient(
                    circle at 20% 30%,
                    rgba(80, 80, 100, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 20%,
                    rgba(120, 70, 140, 0.25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(30, 90, 110, 0.25),
                    transparent 40%
                ),
                #080808;
            filter: blur(30px);
            transform: scale(1.1);
        }

        /* Subtle dark overlay */
        .background::after {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
        }

        /* Main page */
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 25px 30px;
        }

        .content {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        /* Website title */
        h1 {
            font-size: clamp(2.5rem, 8vw, 5.5rem);
            font-weight: 300;
            letter-spacing: -0.04em;
            margin-bottom: 50px;
            text-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* Page links */
        .links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .links a {
            display: block;
            padding: 18px 24px;
            color: #ffffff;
            text-decoration: none;
            font-size: 1.05rem;
            letter-spacing: 0.02em;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            transition:
                transform 0.25s ease,
                background 0.25s ease,
                border-color 0.25s ease;
        }

        .links a:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Footer */
        footer {
            margin-top: 70px;
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
        }

        /* Mobile adjustments */
        @media (max-width: 600px) {
            .page {
                padding: 40px 18px 25px;
            }

            h1 {
                margin-bottom: 35px;
            }

            .links a {
                padding: 16px 20px;
            }

            footer {
                margin-top: 50px;
            }
        }
    </style>
</head>

<body>

    <div class="background"></div>

    <main class="page">

        <div class="content">

            <h1>MichaelDryden.co.uk</h1>

            <nav>
                <ul class="links">

                    <!-- Change these titles and URLs -->
                    <li>
                        <a href="about.html">About Me</a>
                    </li>

                    <li>
                        <a href="projects.html">Projects</a>
                    </li>

                    <li>
                        <a href="contact.html">Contact</a>
                    </li>

                    <li>
                        <a href="blog.html">Blog</a>
                    </li>

                </ul>
            </nav>

            <footer>
                &copy; Michael Dryden 2026
            </footer>

        </div>

    </main>

</body>
</html>
